<section class="mx-auto max-w-3xl px-4 py-8 sm:px-6 lg:py-10">

  <a
    [routerLink]="[
      '/dashboard/salons',
      salonId,
      'employees'
    ]"
    class="text-sm text-gray-500 hover:text-gray-900"
  >
    â† Retour aux employÃ©s
  </a>

  <div class="mt-6">
    <p class="text-sm text-gray-500">
      Gestion du salon
    </p>

    <h1 class="text-2xl font-bold">
      Modifier l'employÃ©
    </h1>
  </div>

  @if (isLoading) {

    <div class="mt-8">
      Chargement de l'employÃ©...
    </div>

  } @else {

    @if (errorMessage) {
      <div
        class="mt-6 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
      >
        {{ errorMessage }}
      </div>
    }

    <form
      class="mt-8 space-y-6"
      (ngSubmit)="submit()"
    >

      <div>

        <label
          for="fullName"
          class="mb-2 block text-sm font-medium"
        >
          Nom complet
        </label>

        <input
          id="fullName"
          name="fullName"
          type="text"
          [(ngModel)]="fullName"
          required
          maxlength="100"
          class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-gray-950 outline-none transition placeholder:text-gray-400 focus:border-gray-950 focus:ring-2 focus:ring-gray-950/10"
        />

      </div>

      <div>

        <label
          for="phoneNumber"
          class="mb-2 block text-sm font-medium"
        >
          TÃ©lÃ©phone
        </label>

        <input
          id="phoneNumber"
          name="phoneNumber"
          type="text"
          [(ngModel)]="phoneNumber"
          maxlength="10"
          pattern="[0-9]{10}"
          class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-gray-950 outline-none transition placeholder:text-gray-400 focus:border-gray-950 focus:ring-2 focus:ring-gray-950/10"
        />

      </div>

      <div>

        <label
          for="specialty"
          class="mb-2 block text-sm font-medium"
        >
          SpÃ©cialitÃ©
        </label>

        <input
          id="specialty"
          name="specialty"
          type="text"
          [(ngModel)]="specialty"
          maxlength="50"
          class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-gray-950 outline-none transition placeholder:text-gray-400 focus:border-gray-950 focus:ring-2 focus:ring-gray-950/10"
        />

      </div>

      <label class="flex items-center gap-3">

        <input
          type="checkbox"
          name="isActive"
          [(ngModel)]="isActive"
        />

        <span class="text-sm">
          EmployÃ© actif
        </span>

      </label>

      <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">

        <a
          [routerLink]="[
            '/dashboard/salons',
            salonId,
            'employees'
          ]"
          class="inline-flex min-h-11 items-center justify-center rounded-xl border border-gray-300 bg-white px-5 py-3 text-sm font-medium text-gray-800 transition hover:bg-gray-50"
        >
          Annuler
        </a>

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="inline-flex min-h-11 items-center justify-center rounded-xl bg-gray-950 px-5 py-3 text-sm font-semibold text-white transition hover:bg-gray-800 disabled:cursor-not-allowed disabled:opacity-50"
        >
          @if (isSubmitting) {
            Enregistrement...
          } @else {
            Enregistrer
          }
        </button>

      </div>

    </form>

  }

</section>
