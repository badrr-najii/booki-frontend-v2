<section class="mx-auto max-w-3xl px-6 py-8">

  <a
    [routerLink]="[
      '/dashboard/salons',
      salonId,
      'employees'
    ]"
    class="text-sm text-gray-500 hover:text-gray-900"
  >
    ← Retour aux employés
  </a>

  <div class="mt-6">
    <p class="text-sm text-gray-500">
      Gestion du salon
    </p>

    <h1 class="text-2xl font-bold">
      Modifier l'employé
    </h1>
  </div>

  @if (isLoading) {

    <div class="mt-8">
      Chargement de l'employé...
    </div>

  } @else {

    @if (errorMessage) {
      <div
        class="mt-6 rounded-lg border border-red-200 p-4 text-sm text-red-600"
      >
        {{ errorMessage }}
      </div>
    }

    <form
      class="mt-8 space-y-6"
      (ngSubmit)="submit()"
    >

      <div>

        <label
          for="fullName"
          class="mb-2 block text-sm font-medium"
        >
          Nom complet
        </label>

        <input
          id="fullName"
          name="fullName"
          type="text"
          [(ngModel)]="fullName"
          required
          maxlength="100"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-black"
        />

      </div>

      <div>

        <label
          for="phoneNumber"
          class="mb-2 block text-sm font-medium"
        >
          Téléphone
        </label>

        <input
          id="phoneNumber"
          name="phoneNumber"
          type="text"
          [(ngModel)]="phoneNumber"
          maxlength="10"
          pattern="[0-9]{10}"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-black"
        />

      </div>

      <div>

        <label
          for="specialty"
          class="mb-2 block text-sm font-medium"
        >
          Spécialité
        </label>

        <input
          id="specialty"
          name="specialty"
          type="text"
          [(ngModel)]="specialty"
          maxlength="50"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-black"
        />

      </div>

      <label class="flex items-center gap-3">

        <input
          type="checkbox"
          name="isActive"
          [(ngModel)]="isActive"
        />

        <span class="text-sm">
          Employé actif
        </span>

      </label>

      <div class="flex justify-end gap-3">

        <a
          [routerLink]="[
            '/dashboard/salons',
            salonId,
            'employees'
          ]"
          class="rounded-lg border border-gray-300 px-5 py-3 text-sm hover:bg-gray-50"
        >
          Annuler
        </a>

        <button
          type="submit"
          [disabled]="isSubmitting"
          class="rounded-lg bg-black px-5 py-3 text-sm text-white hover:bg-gray-800 disabled:opacity-50"
        >
          @if (isSubmitting) {
            Enregistrement...
          } @else {
            Enregistrer
          }
        </button>

      </div>

    </form>

  }

</section>
