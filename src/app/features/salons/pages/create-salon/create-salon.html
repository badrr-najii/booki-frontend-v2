<div class="min-h-screen bg-gray-50">

  <div class="mx-auto max-w-3xl px-6 py-10">

    <a
      routerLink="/dashboard"
      class="text-sm text-gray-500 hover:text-black"
    >
      ← Retour au dashboard
    </a>

    <div class="mt-6 mb-8">

      <p class="text-sm text-gray-500">
        Nouveau salon
      </p>

      <h1 class="mt-1 text-3xl font-bold">
        Créer votre salon
      </h1>

      <p class="mt-2 text-gray-500">
        Ajoutez les informations principales
        de votre établissement.
      </p>

    </div>

    <form
      [formGroup]="salonForm"
      (ngSubmit)="onSubmit()"
      class="rounded-2xl border
             border-gray-200
             bg-white p-8"
    >

      @if (errorMessage) {

        <div
          class="mb-6 rounded-xl
                 bg-red-50 p-4
                 text-sm text-red-700"
        >
          {{ errorMessage }}
        </div>

      }

      <div class="grid gap-6">

        <div>

          <label
            class="mb-2 block
                   text-sm font-medium"
          >
            Nom du salon *
          </label>

          <input
            type="text"
            formControlName="name"
            (input)="onNameChange()"
            placeholder="Ex: Beauty Studio"
            class="w-full rounded-xl
                   border border-gray-300
                   px-4 py-3
                   outline-none
                   focus:border-black"
          >

        </div>

        <div>

          <label
            class="mb-2 block
                   text-sm font-medium"
          >
            Slug *
          </label>

          <input
            type="text"
            formControlName="slug"
            placeholder="beauty-studio"
            class="w-full rounded-xl
                   border border-gray-300
                   px-4 py-3
                   outline-none
                   focus:border-black"
          >

          <p class="mt-2 text-xs text-gray-500">
            Utilisé dans l'URL publique du salon.
          </p>

        </div>

        <div>

          <label
            class="mb-2 block
                   text-sm font-medium"
          >
            Description
          </label>

          <textarea
            formControlName="description"
            rows="4"
            placeholder="Présentez votre salon..."
            class="w-full rounded-xl
                   border border-gray-300
                   px-4 py-3
                   outline-none
                   focus:border-black"
          ></textarea>

        </div>

        <div class="grid gap-6 md:grid-cols-2">

          <div>

            <label
              class="mb-2 block
                     text-sm font-medium"
            >
              Ville
            </label>

            <input
              type="text"
              formControlName="city"
              placeholder="Casablanca"
              class="w-full rounded-xl
                     border border-gray-300
                     px-4 py-3
                     outline-none
                     focus:border-black"
            >

          </div>

          <div>

            <label
              class="mb-2 block
                     text-sm font-medium"
            >
              Téléphone
            </label>

            <input
              type="text"
              formControlName="phoneNumber"
              placeholder="+212..."
              class="w-full rounded-xl
                     border border-gray-300
                     px-4 py-3
                     outline-none
                     focus:border-black"
            >

          </div>

        </div>

        <div>

          <label
            class="mb-2 block
                   text-sm font-medium"
          >
            Adresse
          </label>

          <input
            type="text"
            formControlName="address"
            placeholder="Adresse du salon"
            class="w-full rounded-xl
                   border border-gray-300
                   px-4 py-3
                   outline-none
                   focus:border-black"
          >

        </div>

        <div>

          <label
            class="mb-2 block
                   text-sm font-medium"
          >
            Email
          </label>

          <input
            type="email"
            formControlName="email"
            placeholder="contact@salon.com"
            class="w-full rounded-xl
                   border border-gray-300
                   px-4 py-3
                   outline-none
                   focus:border-black"
          >

        </div>

      </div>

      <div
        class="mt-8 flex
               items-center
               justify-end gap-3"
      >

        <a
          routerLink="/dashboard"
          class="rounded-xl border
                 border-gray-300
                 px-5 py-3
                 text-sm font-medium"
        >
          Annuler
        </a>

        <button
          type="submit"
          [disabled]="isLoading"
          class="rounded-xl bg-black
                 px-5 py-3
                 text-sm font-semibold
                 text-white
                 disabled:opacity-50"
        >
          @if (isLoading) {
            Création...
          } @else {
            Créer le salon
          }
        </button>

      </div>

    </form>

  </div>
</div>
