<header class="sticky top-0 z-50 border-b border-gray-200 bg-white/95 backdrop-blur">
  <div
    class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6"
  >
    <a
      routerLink="/"
      class="shrink-0 text-2xl font-bold tracking-tight text-gray-950"
    >
      Booki
    </a>

    <nav
      aria-label="Navigation principale"
      class="flex items-center gap-2 text-sm font-medium sm:gap-4"
    >
      <a
        routerLink="/"
        routerLinkActive="text-black"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hidden text-gray-600 transition hover:text-gray-950 md:inline-flex"
      >
        Accueil
      </a>

      @if (authService.isAuthenticated()) {

        <a
          routerLink="/dashboard"
          routerLinkActive="bg-gray-100 text-black"
          class="rounded-lg px-3 py-2 text-gray-700 transition hover:bg-gray-100 hover:text-gray-950"
        >
          Dashboard
        </a>

        <button
          type="button"
          (click)="logout()"
          [disabled]="isLoggingOut"
          class="rounded-lg border border-gray-300 px-3 py-2 text-gray-800 transition hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50 sm:px-4"
        >
          @if (isLoggingOut) {
            <span class="hidden sm:inline">Déconnexion...</span>
            <span class="sm:hidden">...</span>
          } @else {
            <span class="hidden sm:inline">Se déconnecter</span>
            <span class="sm:hidden">Quitter</span>
          }
        </button>

      } @else {

        <a
          routerLink="/login"
          routerLinkActive="text-black"
          class="hidden text-gray-600 transition hover:text-gray-950 sm:inline-flex"
        >
          Se connecter
        </a>

        <a
          routerLink="/register"
          class="rounded-lg bg-black px-3 py-2 text-white transition hover:bg-gray-800 sm:px-4"
        >
          <span class="hidden sm:inline">Créer mon salon</span>
          <span class="sm:hidden">S'inscrire</span>
        </a>

      }
    </nav>
  </div>
</header>
