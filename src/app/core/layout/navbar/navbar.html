<header
  class="sticky top-0 z-50 border-b border-zinc-200/80
         bg-white/90 backdrop-blur-xl"
>
  <div
    class="mx-auto flex h-[72px] max-w-7xl items-center
           justify-between gap-4 px-6 lg:px-8"
  >

<a
  routerLink="/"
  class="group inline-flex shrink-0 items-center gap-3"
  aria-label="Booki - Accueil"
>
  <!-- Logo Booki: Calendar + B -->
  <span
    class="relative flex h-10 w-10 shrink-0 items-center
           justify-center overflow-hidden rounded-xl
           bg-gradient-to-br from-violet-500 via-violet-600
           to-indigo-700 shadow-md shadow-violet-500/20
           transition-all duration-300
           group-hover:-translate-y-0.5
           group-hover:shadow-lg
           group-hover:shadow-violet-500/30"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 40 40"
      fill="none"
      class="h-8 w-8"
      aria-hidden="true"
    >
      <!-- Calendar body -->
      <rect
        x="7"
        y="11"
        width="26"
        height="23"
        rx="5"
        fill="white"
      />

      <!-- Calendar top -->
      <path
        d="M7 17H33"
        stroke="#DDD6FE"
        stroke-width="2"
      />

      <!-- Calendar rings -->
      <path
        d="M14 7V13M26 7V13"
        stroke="white"
        stroke-width="3.5"
        stroke-linecap="round"
      />

      <!-- Letter B -->
      <text
        x="20"
        y="29"
        text-anchor="middle"
        font-size="15"
        font-weight="800"
        font-family="Arial, sans-serif"
        fill="#5B21B6"
      >
        B
      </text>
    </svg>
  </span>

  <!-- Brand name -->
  <span
    class="text-[22px] font-extrabold tracking-[-0.045em]
           text-slate-950 transition-colors
           group-hover:text-violet-700"
  >
    Book<span class="text-violet-600">i</span>
  </span>
</a>


    <nav
      aria-label="Navigation principale"
      class="flex items-center gap-2 text-sm font-medium"
    >
      <a
        routerLink="/"
        routerLinkActive="text-zinc-950"
        [routerLinkActiveOptions]="{ exact: true }"
        class="hidden rounded-lg px-3 py-2
               text-zinc-500 transition
               hover:bg-zinc-50 hover:text-zinc-950
               md:inline-flex"
      >
        Accueil
      </a>

      @if (authService.isAuthenticated()) {

        @if (authService.isOwner()) {
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-zinc-100 text-zinc-950"
            [routerLinkActiveOptions]="{ exact: true }"
            class="rounded-xl px-3 py-2 text-zinc-600
                   transition hover:bg-zinc-100
                   hover:text-zinc-950 sm:px-4"
          >
            Dashboard
          </a>

          <a
            routerLink="/dashboard/notifications"
            routerLinkActive="bg-zinc-100 text-zinc-950"
            class="relative inline-flex h-10 w-10
                   items-center justify-center rounded-xl
                   text-zinc-600 transition
                   hover:bg-zinc-100 hover:text-zinc-950"
            aria-label="Notifications"
          >
            <span
              aria-hidden="true"
              class="text-lg leading-none"
            >
              &#128276;
            </span>

            @if (unreadCount > 0) {
              <span
                class="absolute -right-1 -top-1 flex
                       min-h-5 min-w-5 items-center
                       justify-center rounded-full
                       bg-zinc-950 px-1 text-[10px]
                       font-bold leading-none text-white"
              >
                {{ unreadCount > 99 ? '99+' : unreadCount }}
              </span>
            }
          </a>
        }

                @if (authService.isAdmin()) {
          <a
            routerLink="/admin"
            routerLinkActive="bg-zinc-100 text-zinc-950"
            class="rounded-xl px-3 py-2 text-zinc-600
                   transition hover:bg-zinc-100
                   hover:text-zinc-950 sm:px-4"
          >
            Admin
          </a>
        }

        <a
          routerLink="/account"
          routerLinkActive="bg-zinc-100 text-zinc-950"
          class="rounded-xl px-3 py-2 text-zinc-600
                 transition hover:bg-zinc-100
                 hover:text-zinc-950 sm:px-4"
        >
          <span class="hidden sm:inline">
            Mon compte
          </span>

          <span class="sm:hidden">
            Compte
          </span>
        </a>

        <button
          type="button"
          (click)="logout()"
          [disabled]="isLoggingOut"
          class="rounded-xl border border-zinc-200
                 bg-white px-3 py-2 text-zinc-700
                 transition hover:bg-zinc-50
                 hover:text-zinc-950
                 disabled:cursor-not-allowed
                 disabled:opacity-50 sm:px-4"
        >
          @if (isLoggingOut) {
            <span class="hidden sm:inline">
              Déconnexion...
            </span>

            <span class="sm:hidden">
              ...
            </span>
          } @else {
            <span class="hidden sm:inline">
              Se déconnecter
            </span>

            <span class="sm:hidden">
              Quitter
            </span>
          }
        </button>

      } @else {

        <a
          routerLink="/login"
          routerLinkActive="text-zinc-950"
          class="hidden rounded-lg px-3 py-2
                 text-zinc-500 transition
                 hover:bg-zinc-50 hover:text-zinc-950
                 sm:inline-flex"
        >
          Se connecter
        </a>

        <a
          routerLink="/register"
          class="inline-flex items-center justify-center
                 rounded-xl bg-zinc-950 px-4 py-2.5
                 text-white transition hover:bg-zinc-800
                 focus:outline-none focus:ring-2
                 focus:ring-zinc-950 focus:ring-offset-2"
        >
          <span class="hidden sm:inline">
            Créer mon salon
          </span>

          <span class="sm:hidden">
            S'inscrire
          </span>
        </a>

      }
    </nav>
  </div>
</header>
