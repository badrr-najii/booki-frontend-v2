
<app-navbar></app-navbar>

<div class="min-h-[calc(100vh-72px)] bg-slate-50">

  <!-- Mobile toolbar -->
  <div class="flex items-center justify-between border-b
              border-slate-200 bg-white px-5 py-3 lg:hidden">
    <span class="text-sm font-semibold text-slate-900">
      Administration
    </span>

    <button
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="isSidebarOpen()"
      aria-controls="admin-sidebar"
      aria-label="Afficher ou masquer le menu"
      class="rounded-xl border border-slate-200
             bg-white p-2 text-slate-700"
    >
      <svg class="h-5 w-5" fill="none"
           viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="1.8"
           aria-hidden="true">
        <path stroke-linecap="round"
              d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
  </div>

  <!-- Mobile overlay -->
  @if (isSidebarOpen()) {
    <button
      type="button"
      (click)="closeSidebar()"
      aria-label="Fermer le menu"
      class="fixed inset-0 z-40 bg-slate-950/40 lg:hidden"
    ></button>
  }

  <!-- Sidebar -->
  <aside
    id="admin-sidebar"
    class="fixed bottom-0 left-0 top-[72px] z-40
           w-64 border-r border-slate-800
           bg-slate-950 text-white
           transition-transform duration-200
           lg:translate-x-0"
    [class.translate-x-0]="isSidebarOpen()"
    [class.-translate-x-full]="!isSidebarOpen()"
  >
    <div class="flex h-full flex-col px-4 py-6">

      <div class="mb-8 px-3">
        <p class="text-[10px] font-bold uppercase
                  tracking-[0.18em] text-slate-500">
          Espace administrateur
        </p>
        <h2 class="mt-2 text-lg font-bold tracking-tight">
          Workspace
        </h2>
      </div>

      <p class="mb-3 px-3 text-[10px] font-semibold
                uppercase tracking-widest text-slate-500">
        Navigation
      </p>

      <nav aria-label="Menu administration"
           class="space-y-1">

        <a
          routerLink="/admin"
          routerLinkActive="!bg-violet-600 !text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidebar()"
          class="flex items-center gap-3 rounded-xl
                 px-3 py-3 text-sm font-medium
                 text-slate-300 transition
                 hover:bg-slate-800 hover:text-white"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          Tableau de bord
        </a>

        <a
          routerLink="/admin/users"
          routerLinkActive="!bg-violet-600 !text-white"
          (click)="closeSidebar()"
          class="flex items-center gap-3 rounded-xl
                 px-3 py-3 text-sm font-medium
                 text-slate-300 transition
                 hover:bg-slate-800 hover:text-white"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24"
               fill="none" stroke="currentColor"
               stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path stroke-linecap="round"
                  d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Utilisateurs
        </a>
      </nav>

      <div class="mt-auto border-t border-slate-800 pt-5">
        <div class="rounded-xl bg-slate-900 px-4 py-3">
          <p class="text-xs font-semibold text-white">
            Booki Admin
          </p>
          <p class="mt-1 text-xs text-slate-400">
            Gestion de la plateforme
          </p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="min-w-0 lg:ml-64">
    <router-outlet></router-outlet>
  </main>
</div>
